<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Nexium Client - Discord, repris en main">
  <defs>
    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0dcb4"/>
      <stop offset="45%" stop-color="#e6c48a"/>
      <stop offset="100%" stop-color="#c79a4e"/>
    </linearGradient>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16161b"/>
      <stop offset="55%" stop-color="#101013"/>
      <stop offset="100%" stop-color="#0b0b0e"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#e6c48a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e6c48a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eclat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6c48a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e6c48a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e6c48a" stop-opacity="0"/>
    </linearGradient>
    <mask id="mtitre">
      <text x="600" y="228" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="6" fill="#ffffff">NEXIUM CLIENT</text>
    </mask>
    <clipPath id="cadre"><rect x="0" y="0" width="1200" height="360" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#cadre)">
    <rect x="0" y="0" width="1200" height="360" rx="20" fill="url(#fond)"/>
    <rect x="0" y="0" width="1200" height="360" fill="url(#halo)"/>

    <g fill="#e6c48a" opacity="0.5">
      <circle cx="150" cy="70" r="1.6"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="1050" cy="96" r="1.6"><animate attributeName="opacity" values="0.6;0.12;0.6" dur="5.5s" repeatCount="indefinite"/></circle>
      <circle cx="240" cy="290" r="1.4"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="6.5s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="268" r="1.4"><animate attributeName="opacity" values="0.55;0.15;0.55" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="80" cy="200" r="1.2"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="1130" cy="190" r="1.2"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.5s" repeatCount="indefinite"/></circle>
    </g>

    <rect x="0" y="-70" width="1200" height="70" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,470" dur="6s" repeatCount="indefinite"/>
    </rect>

    <g>
      <circle cx="600" cy="82" r="46" fill="#e6c48a" opacity="0.07">
        <animate attributeName="r" values="40;52;40" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.10;0.03;0.10" dur="4s" repeatCount="indefinite"/>
      </circle>
      <path d="M600 44 L631 57 L631 90 C631 107 617 118 600 124 C583 118 569 107 569 90 L569 57 Z"
            fill="none" stroke="url(#or)" stroke-width="3.2" stroke-linejoin="round"
            stroke-dasharray="260" stroke-dashoffset="260">
        <animate attributeName="stroke-dashoffset" from="260" to="0" dur="1.5s" begin="0.2s" fill="freeze"/>
      </path>
      <path d="M586 84 L596 95 L616 70" fill="none" stroke="#e6c48a" stroke-width="3.4"
            stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="52" stroke-dashoffset="52">
        <animate attributeName="stroke-dashoffset" from="52" to="0" dur="0.5s" begin="1.5s" fill="freeze"/>
      </path>
    </g>

    <text x="600" y="160" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="7" fill="#8a7a5e" opacity="0">
      NEXIUM COLLECTIVE
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.9s" fill="freeze"/>
    </text>

    <text x="600" y="228" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="6" fill="url(#or)" opacity="0">
      NEXIUM CLIENT
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.4s" fill="freeze"/>
    </text>
    <g mask="url(#mtitre)">
      <rect x="-420" y="170" width="360" height="80" fill="url(#eclat)" opacity="0.55">
        <animateTransform attributeName="transform" type="translate" values="0,0; 1700,0" dur="5s" begin="2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="600" y="268" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#9a9aa4" opacity="0">
      Discord, repris en main.
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="1.2s" fill="freeze"/>
    </text>

    <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.7s" fill="freeze"/>
        <rect x="352" y="298" width="150" height="32" rx="16" fill="#1c1c22" stroke="#2f2f38"/>
        <text x="427" y="319" fill="#d9a441">Anti-arnaque</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.95s" fill="freeze"/>
        <rect x="514" y="298" width="172" height="32" rx="16" fill="#1c1c22" stroke="#2f2f38"/>
        <text x="600" y="319" fill="#5fb37a">Anti-telemetrie</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.2s" fill="freeze"/>
        <rect x="698" y="298" width="150" height="32" rx="16" fill="#1c1c22" stroke="#2f2f38"/>
        <text x="773" y="319" fill="#6a8fd6">100% francais</text>
      </g>
    </g>

    <rect x="0" y="356" width="1200" height="4" fill="url(#or)" opacity="0.55"/>
    <rect x="0" y="0" width="1200" height="360" rx="20" fill="none" stroke="#2a2a31" stroke-width="2"/>
  </g>
</svg>
