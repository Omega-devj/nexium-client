      <text x="52" y="67" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">K</text>
      <text x="88" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#e8e8ea">kevin_2011</text>
      <text x="190" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6a6a73">aujourd'hui a 21:04</text>
      <text x="88" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#c9c9d0">yo regarde, nitro gratuit pendant 24h</text>
      <rect x="88" y="92" width="368" height="34" rx="8" fill="#1a1a20" stroke="#2a2a31"/>
      <text x="104" y="114" font-family="Consolas, Menlo, monospace" font-size="13" fill="#6a8fd6">https://discord-nitro-gift.ru/claim</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.20;0.23;0.32;0.35;1" dur="10s" repeatCount="indefinite"/>
      <rect x="0" y="92" width="90" height="34" fill="url(#bande)">
        <animateTransform attributeName="transform" type="translate" values="60,0;60,0;420,0;420,0" keyTimes="0;0.2;0.34;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.20;0.23;0.33;0.35;1" dur="10s" repeatCount="indefinite"/>
      <text x="472" y="114" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="1" fill="#8a7a5e">ANALYSE...</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.10;0.19;0.30;0.33;1" dur="10s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="640,220;640,220;238,104;238,104;238,104" keyTimes="0;0.06;0.18;0.33;1" dur="10s" repeatCount="indefinite"/>
      <path d="M0 0 L0 17 L4.6 12.6 L7.4 18.6 L10.6 17.1 L7.9 11.3 L13.6 10.9 Z" fill="#ffffff" stroke="#0a0a0c" stroke-width="1.1"/>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.35;0.39;0.93;0.98;1" dur="10s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,14;0,14;0,0;0,0" keyTimes="0;0.35;0.40;1" dur="10s" repeatCount="indefinite"/>

      <rect x="52" y="152" width="896" height="164" rx="12" fill="#17171a" stroke="#3a2226" stroke-width="1.5"/>
      <rect x="52" y="152" width="5" height="164" rx="2.5" fill="#d6484a"/>

      <path d="M88 178 L108 186 L108 208 C108 219 99 226 88 230 C77 226 68 219 68 208 L68 186 Z" fill="none" stroke="#d6484a" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M81 197 L95 211 M95 197 L81 211" stroke="#d6484a" stroke-width="2.4" stroke-linecap="round"/>

      <text x="130" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#e8e8ea">Lien bloque avant l'ouverture</text>
      <text x="130" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#a5a6ab">Ce domaine imite <tspan fill="#e8e8ea" font-weight="600">discord.com</tspan> et figure dans la base de menaces.</text>
      <text x="130" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#a5a6ab">Aucune requete n'est partie de ta machine.</text>

      <g font-family="Segoe UI, Arial, sans-serif" font-size="12">
        <rect x="130" y="262" width="176" height="26" rx="13" fill="#1e1418" stroke="#3a2226"/>
        <text x="146" y="279" fill="#d6484a">imitation de domaine</text>
        <rect x="316" y="262" width="150" height="26" rx="13" fill="#1c1c22" stroke="#2f2f38"/>
        <text x="332" y="279" fill="#8a8a94">.ru &#183; non reconnu</text>
        <rect x="476" y="262" width="176" height="26" rx="13" fill="#1c1c22" stroke="#2f2f38"/>
        <text x="492" y="279" fill="#8a8a94">verifie en 0,4 ms</text>
      </g>

      <g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">
        <rect x="702" y="186" width="222" height="38" rx="8" fill="#e6c48a"/>
        <text x="813" y="211" text-anchor="middle" fill="#17171a">Signaler ce domaine</text>
        <rect x="702" y="234" width="222" height="38" rx="8" fill="#1c1c22" stroke="#2f2f38"/>
        <text x="813" y="259" text-anchor="middle" fill="#8a8a94">Ouvrir quand meme</text>
      </g>
