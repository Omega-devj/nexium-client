<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-label="Nexium Protect bloque un lien qui imite discord.com">
  <defs>
    <linearGradient id="bande" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6c48a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e6c48a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e6c48a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="zone"><rect x="1" y="1" width="998" height="348" rx="14"/></clipPath>
  </defs>

  <rect x="1" y="1" width="998" height="348" rx="14" fill="#101013" stroke="#2a2a31" stroke-width="2"/>
  <g clip-path="url(#zone)">

    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.08;0.9;0.95;1" dur="10s" repeatCount="indefinite"/>
